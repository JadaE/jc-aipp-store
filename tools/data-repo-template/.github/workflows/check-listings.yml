# Template for the aipp-store-data repo (inert here). Re-scans every listing on each PR (Security Lead P1-2, P2-2).
name: check-listings
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: JadaE/jc-aipp-store, ref: master, path: store }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node store/tools/check-listings.mjs listings
        env: { GH_TOKEN: "${{ github.token }}" }
